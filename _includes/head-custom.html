<!-- No theme-color tag here, deliberately. Cayman's _layouts/default.html
     hardcodes <meta name="theme-color" content="#157878"> BEFORE the
     head-custom include, and HTML specifies that theme-color uses the FIRST
     parseable value (CSSWG resolved 2020-06-24 that color-scheme follows the
     same rule; Blink was patched to match). A second tag here would therefore
     be silently ignored and the site would keep Cayman's teal -- a no-op that
     looks like it works. To actually change the colour you must copy
     _layouts/default.html into the repo and edit it, which pins the layout and
     stops it tracking upstream theme updates. Not worth it for a chrome tint.
     See https://github.com/w3c/csswg-drafts/issues/3846 -->
